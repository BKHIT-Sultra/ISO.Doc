<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center 
                  text-white text-2xl font-bold mb-3">ISO</div>
      <h1 class="text-2xl font-bold text-slate-800">ISO Doc Management</h1>
      <p class="text-sm text-slate-500 mt-1">Sistem Manajemen Dokumen Terintegrasi</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
               placeholder="nama@company.com"
               class="w-full px-4 py-2 border border-slate-200 rounded-lg 
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required
               placeholder="••••••••"
               class="w-full px-4 py-2 border border-slate-200 rounded-lg 
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit" id="btnLogin"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold 
                     py-2.5 rounded-lg transition disabled:opacity-50">
        Login
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
      Belum punya akun? Hubungi Administrator IT.
    </p>
  </div>

  <script type="module">
    import { login, getSession } from './assets/js/auth.js';
    import { showToast } from './assets/js/components/toast.js';
    import { btnLoading, btnReset, showOverlay, hideOverlay } from './assets/js/components/loader.js';
  
    if (getSession()) location.href = 'dashboard.html';
  
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnLogin');
  
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      // Tampilkan loading di tombol
      btnLoading(btn, 'Memverifikasi...');
      showOverlay('Memverifikasi akun', 'Mohon tunggu sebentar...');
  
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
  
        const user = await login(email, password);
  
        hideOverlay();
        showToast(`✅ Selamat datang, ${user.nama}!`, 'success', 1500);
        setTimeout(() => location.href = 'dashboard.html', 800);
  
      } catch (err) {
        hideOverlay();
        btnReset(btn);
        showToast(err.message || 'Login gagal', 'error');
  
        // Shake animation untuk feedback error
        form.classList.add('animate-shake');
        setTimeout(() => form.classList.remove('animate-shake'), 500);
      }
    });
  </script>
</body>
</html>
