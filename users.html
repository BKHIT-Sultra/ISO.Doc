<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengguna - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar" class="sticky top-0 z-40"></div>

  <div class="flex">
    <div id="sidebar" 
         class="sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto 
                w-64 flex-shrink-0 hidden lg:block"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8">

      <!-- Page Header -->
      <div class="mb-8 fade-in-up">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0"
                 style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <h1 class="text-3xl lg:text-4xl font-extrabold text-slate-800 leading-tight">
                Manajemen Pengguna
              </h1>
              <p class="text-slate-500 text-sm mt-1">
                Kelola akun & role pengguna sistem
              </p>
            </div>
          </div>

          <button id="btnAddUser" class="btn-gradient">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" 
                    d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            <span>Tambah User</span>
          </button>
        </div>
      </div>

      <!-- Mini Stats -->
      <div id="userStats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6 fade-in-up fade-in-up-1"></div>

      <!-- Filter -->
      <div class="card-premium mb-6 fade-in-up fade-in-up-2">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" 
                  d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <h3 class="text-sm font-bold text-slate-700">Filter & Pencarian</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          
          <!-- Search -->
          <div class="relative md:col-span-1">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input id="fSearch" type="text" placeholder="Cari nama / email..." 
                   class="form-input pl-10">
          </div>

          <!-- Filter Role -->
          <div class="relative">
            <select id="fRole" class="form-select">
              <option value="">Semua Role</option>
              <option value="Admin">Admin</option>
              <option value="Editor">Editor</option>
              <option value="Reviewer">Reviewer</option>
              <option value="Viewer">Viewer</option>
            </select>
          </div>

          <!-- Filter Status -->
          <div class="relative">
            <select id="fStatus" class="form-select">
              <option value="">Semua Status</option>
              <option value="Aktif">Aktif</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="card-premium !p-0 overflow-hidden fade-in-up fade-in-up-3">
        <div class="overflow-x-auto">
          <table class="table-premium">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Departemen</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="userBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="assets/js/pages/users-page.js" type="module"></script>
</body>
</html>
