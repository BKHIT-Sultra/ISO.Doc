<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengguna - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-slate-50">
  <div id="navbar"></div>

  <div class="flex">
    <div id="sidebar"></div>

    <main class="flex-1 p-6">
      <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-800">👥 Manajemen Pengguna</h1>
            <p class="text-sm text-slate-500 mt-1">Kelola akun & role pengguna sistem</p>
          </div>
          <button id="btnAddUser" 
                  class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
            + Tambah User
          </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-slate-50 border-b border-slate-100">
                <tr class="text-left text-xs font-semibold text-slate-600 uppercase">
                  <th class="p-3">Nama</th>
                  <th class="p-3">Email</th>
                  <th class="p-3">Departemen</th>
                  <th class="p-3">Role</th>
                  <th class="p-3">Status</th>
                  <th class="p-3 text-right">Aksi</th>
                </tr>
              </thead>
              <tbody id="userBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderNavbar, attachNavbarEvents } from './assets/js/components/navbar.js';
    import { renderSidebar } from './assets/js/components/sidebar.js';
    import { initUsers } from './assets/js/pages/users.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('navbar').innerHTML = renderNavbar(user);
      document.getElementById('sidebar').innerHTML = renderSidebar(user, 'users');
      attachNavbarEvents();
      initUsers(user);
    }
  </script>
</body>
</html>
