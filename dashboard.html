<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar" class="sticky top-0 z-40"></div>

  <div class="flex">
    <div id="sidebar" 
         class="sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto 
                w-64 flex-shrink-0 hidden lg:block"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8" id="dashboardContent">

      <!-- Page Header -->
      <div class="mb-8 fade-in-up">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-3xl lg:text-4xl font-extrabold text-slate-800 mb-2">
              Dashboard
            </h1>
            <p class="text-slate-500">
              Ringkasan sistem manajemen dokumen ISO terintegrasi
            </p>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">
              Terakhir diperbarui
            </div>
            <div id="lastUpdated" class="text-sm font-semibold text-slate-700">-</div>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div id="summaryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">

        <div class="card-premium fade-in-up fade-in-up-1">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="font-bold text-slate-800">Distribusi per Jenis</h2>
              <p class="text-xs text-slate-500 mt-0.5">Jumlah dokumen per kategori</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </div>
          </div>
          <div id="chartJenis" class="space-y-3"></div>
        </div>

        <div class="card-premium fade-in-up fade-in-up-2">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="font-bold text-slate-800">Status Dokumen</h2>
              <p class="text-xs text-slate-500 mt-0.5">Breakdown status saat ini</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/>
              </svg>
            </div>
          </div>
          <div id="chartStatus" class="space-y-3"></div>
        </div>
      </div>

      <!-- Daftar Klausul Section -->
      <div class="card-premium fade-in-up fade-in-up-3 !p-0 overflow-hidden">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
              </svg>
            </div>
            <div>
              <h2 class="font-bold text-slate-800">Daftar Klausul ISO</h2>
              <p class="text-xs text-slate-500">
                <span id="klausulTotalCount">0</span> klausul terdaftar
              </p>
            </div>
          </div>
          
          <div class="flex flex-wrap gap-2 items-center">
            
            <!-- ★ Tombol Fullscreen / Expand -->
            <button id="btnExpandKlausul" 
                    class="w-10 h-10 rounded-lg flex items-center justify-center 
                           text-slate-500 hover:text-blue-600 hover:bg-blue-50 
                           border border-slate-200 hover:border-blue-300 transition"
                    title="Tampilkan layar penuh">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
              </svg>
            </button>

            <!-- Search klausul -->
            <div class="relative">
              <!-- ... existing ... -->
              
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>
              <input id="klausulSearchBox" type="text" placeholder="Cari klausul..."
                     class="pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg 
                            text-xs focus:outline-none focus:border-blue-500 focus:bg-white 
                            transition w-48">
            </div>

            <!-- Filter Bab -->
            <select id="klausulFilterBab"
                    class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg 
                           text-xs focus:outline-none focus:border-blue-500 focus:bg-white 
                           transition cursor-pointer">
              <option value="">Semua Bab</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
          <table class="table-premium">
            <thead class="sticky top-0 z-10">
              <tr>
                <th class="w-24">Klausul</th>
                <th>Judul Klausul</th>
                <th class="w-40">Bab</th>
                <th class="w-28 text-center">Dokumen</th>
                <th class="w-28 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="klausulTableBody">
              <!-- Skeleton akan di-inject -->
            </tbody>
          </table>
        </div>

      </div>

    </main>
  </div>

  <!-- Script tetap sama seperti sebelumnya -->
  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderNavbar, attachNavbarEvents } from './assets/js/components/navbar.js';
    import { renderSidebar } from './assets/js/components/sidebar.js';
    import { initDashboard } from './assets/js/pages/dashboard.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('navbar').innerHTML = renderNavbar(user);
      document.getElementById('sidebar').innerHTML = renderSidebar(user, 'dashboard');
      attachNavbarEvents();
      initDashboard();
    }
  </script>
</body>
</html>
