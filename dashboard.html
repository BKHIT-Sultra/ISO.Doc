<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar" class="sticky top-0 z-40"></div>

  <div class="flex">
    <div id="sidebar" 
         class="sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto 
                w-64 flex-shrink-0 hidden lg:block"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8" id="dashboardContent">

      <!-- Page Header -->
      <div class="mb-8 fade-in-up">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-3xl lg:text-4xl font-extrabold text-slate-800 mb-2">
              Dashboard
            </h1>
            <p class="text-slate-500">
              Ringkasan sistem manajemen dokumen ISO terintegrasi
            </p>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">
              Terakhir diperbarui
            </div>
            <div id="lastUpdated" class="text-sm font-semibold text-slate-700">-</div>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div id="summaryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">

        <div class="card-premium fade-in-up fade-in-up-1">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="font-bold text-slate-800">Distribusi per Jenis</h2>
              <p class="text-xs text-slate-500 mt-0.5">Jumlah dokumen per kategori</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </div>
          </div>
          <div id="chartJenis" class="space-y-3"></div>
        </div>

        <div class="card-premium fade-in-up fade-in-up-2">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="font-bold text-slate-800">Status Dokumen</h2>
              <p class="text-xs text-slate-500 mt-0.5">Breakdown status saat ini</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/>
              </svg>
            </div>
          </div>
          <div id="chartStatus" class="space-y-3"></div>
        </div>
      </div>

      <!-- Reminder -->
      <div class="card-premium fade-in-up fade-in-up-3 overflow-hidden !p-0">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-yellow-50 flex items-center justify-center">
              <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
            </div>
            <div>
              <h2 class="font-bold text-slate-800">Reminder Review</h2>
              <p class="text-xs text-slate-500">30 hari ke depan</p>
            </div>
          </div>
          <a href="review-reminder.html"
             class="text-sm text-blue-600 hover:text-blue-700 font-semibold 
                    flex items-center gap-1 transition">
            Lihat semua
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
        <div id="reminders"></div>
      </div>

    </main>
  </div>

  <!-- Script tetap sama seperti sebelumnya -->
  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderNavbar, attachNavbarEvents } from './assets/js/components/navbar.js';
    import { renderSidebar } from './assets/js/components/sidebar.js';
    import { initDashboard } from './assets/js/pages/dashboard.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('navbar').innerHTML = renderNavbar(user);
      document.getElementById('sidebar').innerHTML = renderSidebar(user, 'dashboard');
      attachNavbarEvents();
      initDashboard();
    }
  </script>
</body>
</html>
