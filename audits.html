<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Audit - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar" class="sticky top-0 z-40"></div>

  <div class="flex">
    <div id="sidebar" class="sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto w-64 flex-shrink-0 hidden lg:block"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8">
      
      <!-- Header -->
      <div class="mb-8 fade-in-up">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0"
                 style="background: linear-gradient(135deg, #7c3aed, #a855f7);">
              <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <h1 class="text-3xl lg:text-4xl font-extrabold text-slate-800 leading-tight">Hasil Audit</h1>
              <p class="text-slate-500 text-sm mt-1">Dokumentasi hasil audit & tracking perbaikan</p>
            </div>
          </div>

          <button id="btnAddAudit" class="btn-gradient">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span>Tambah Audit</span>
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div id="auditStats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6 fade-in-up fade-in-up-1"></div>

      <!-- Filter -->
      <div class="card-premium mb-6 fade-in-up fade-in-up-2">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <h3 class="text-sm font-bold text-slate-700">Filter</h3>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input id="fSearch" type="text" placeholder="Cari audit..." class="form-input pl-10">
          </div>
          <select id="fJenis" class="form-select">
            <option value="">Semua Jenis</option>
            <option value="Internal">Internal</option>
            <option value="Eksternal">Eksternal</option>
            <option value="Surveillance">Surveillance</option>
          </select>
          <select id="fStatus" class="form-select">
            <option value="">Semua Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
      </div>

      <!-- List -->
      <div id="auditList" class="space-y-3 fade-in-up fade-in-up-3"></div>

    </main>
  </div>

  <script src="assets/js/pages/audits.js" type="module"></script>
</body>
</html>
