<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Audit - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar" class="sticky top-0 z-40"></div>

  <div class="flex">
    <div id="sidebar" 
         class="sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto 
                w-64 flex-shrink-0 hidden lg:block"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8">

      <!-- Breadcrumb -->
      <div class="mb-6 fade-in-up">
        <a href="audits.html"
           class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 
                  hover:text-blue-600 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          Kembali ke Hasil Audit
        </a>
      </div>

      <!-- Loading -->
      <div id="loadingState" class="card-premium p-16 text-center fade-in-up">
        <div class="inline-block animate-spin rounded-full h-10 w-10 
                    border-4 border-blue-500 border-t-transparent mb-4"></div>
        <div class="text-slate-500 text-sm">Memuat data audit...</div>
      </div>

      <!-- Content -->
      <div id="contentState" class="hidden">

        <!-- Header Audit -->
        <div id="auditHeader" class="mb-8 fade-in-up"></div>

        <!-- Info Cards -->
        <div id="infoCards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-8 fade-in-up fade-in-up-1"></div>

        <!-- Section Temuan -->
        <div class="card-premium !p-0 overflow-hidden fade-in-up fade-in-up-2">
          
          <!-- Header Section -->
          <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" 
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </div>
              <div>
                <h2 class="font-bold text-slate-800">Daftar Temuan</h2>
                <p class="text-xs text-slate-500">
                  <span id="temuanCount">0</span> temuan terdaftar
                </p>
              </div>
            </div>

            <button id="btnAddTemuan" class="btn-gradient">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
              <span>Tambah Temuan</span>
            </button>
          </div>

          <!-- Section Lampiran -->
          <div class="card-premium !p-0 overflow-hidden fade-in-up fade-in-up-3 mt-6">
          
            <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
                  <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                  </svg>
                </div>
                <div>
                  <h2 class="font-bold text-slate-800">Lampiran Hasil Audit</h2>
                  <p class="text-xs text-slate-500">
                    <span id="lampiranCount">0</span> file terupload
                  </p>
                </div>
              </div>
              <button id="btnUploadFile" class="btn-gradient">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                <span>Upload File</span>
              </button>
            </div>
          
            <div id="lampiranList" class="p-6 space-y-2">
              <div class="text-center py-8 text-sm text-slate-500">Memuat lampiran...</div>
            </div>
          
          </div>

          <!-- Filter Temuan -->
          <div class="px-6 py-3 border-b border-slate-100 bg-slate-50/50">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div class="relative md:col-span-2">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                  </svg>
                </div>
                <input id="fTemuanSearch" type="text" placeholder="Cari deskripsi / klausul..." 
                       class="form-input pl-10">
              </div>
              <select id="fTemuanJenis" class="form-select">
                <option value="">Semua Jenis</option>
                <option value="Major">Major</option>
                <option value="Minor">Minor</option>
                <option value="OFI">OFI</option>
                <option value="Observasi">Observasi</option>
              </select>
              <select id="fTemuanStatus" class="form-select">
                <option value="">Semua Status</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>

          <!-- List Temuan -->
          <div id="temuanList" class="p-6 space-y-3"></div>

        </div>

      </div>

      <!-- Error -->
      <div id="errorState" class="hidden card-premium p-12 text-center"></div>

    </main>
  </div>

  <script src="assets/js/pages/audit-detail.js" type="module"></script>
</body>
</html>
