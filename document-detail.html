<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Dokumen - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-slate-50">
  <div id="navbar"></div>

  <div class="flex">
    <div id="sidebar"></div>

    <main class="flex-1 p-6">
      <div class="max-w-6xl mx-auto">
        <!-- Breadcrumb & Title -->
        <div class="mb-6">
          <a href="documents.html" class="text-sm text-blue-600 hover:underline">← Kembali ke Daftar Dokumen</a>
          <div id="titleArea" class="mt-3"></div>
        </div>

        <div id="detailContent">
          <!-- Loading -->
          <div class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <div class="text-slate-500 mt-3 text-sm">Memuat dokumen...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderNavbar, attachNavbarEvents } from './assets/js/components/navbar.js';
    import { renderSidebar } from './assets/js/components/sidebar.js';
    import { initDocumentDetail } from './assets/js/pages/document-detail.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('navbar').innerHTML = renderNavbar(user);
      document.getElementById('sidebar').innerHTML = renderSidebar(user, 'documents');
      attachNavbarEvents();
      initDocumentDetail(user);
    }
  </script>
</body>
</html>
