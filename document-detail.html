<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Dokumen - ISO Doc Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>

  <div class="flex">
    <div id="sidebar"></div>

    <main class="flex-1 min-w-0 p-4 lg:p-8">

      <!-- Breadcrumb -->
      <div class="mb-6 fade-in-up">
        <a href="documents.html"
           class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 
                  hover:text-blue-600 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          Kembali ke Daftar Dokumen
        </a>
      </div>

      <!-- Title Area -->
      <div id="titleArea" class="mb-8"></div>

      <!-- Detail Content -->
      <div id="detailContent">
        <!-- Initial loading spinner -->
        <div class="card-premium p-16 text-center">
          <div class="inline-block animate-spin rounded-full h-10 w-10 
                      border-4 border-blue-500 border-t-transparent mb-4"></div>
          <div class="text-slate-500 text-sm">Memuat dokumen...</div>
        </div>
      </div>

    </main>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderNavbar, attachNavbarEvents } from './assets/js/components/navbar.js';
    import { renderSidebar } from './assets/js/components/sidebar.js';
    import { initDocumentDetail } from './assets/js/pages/document-detail.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('navbar').innerHTML = renderNavbar(user);
      document.getElementById('sidebar').innerHTML = renderSidebar(user, 'documents');
      attachNavbarEvents();
      initDocumentDetail(user);
    }
  </script>
</body>
</html>
